[workspace]
resolver = "3"
members = ["crates/ultron-core", "crates/ultrond", "crates/ultron", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
# Claude kota uc noktasi icin; ring tabanli rustls (aws-lc/cmake gerektirmez), varsayilan native-tls yok.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }

[workspace.lints.cargo]
# Tum bagimliliklar Task 0'da bildirilir; her crate yalnizca kullandigini ceker.
unused_workspace_dependencies = "allow"
